name: R analysis and manuscript
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DP_BOOT_WORKERS: 4
      DP_DATA_ROOT: ${{ github.workspace }}/build/dp-data
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Read data revision
        id: data
        run: echo "revision=$(jq -r .data_commit tabs/phase_provenance.json)" >> "$GITHUB_OUTPUT"
      - name: Check out data sources
        uses: actions/checkout@v7.0.1
        with:
          repository: soodoku/dp-data
          ref: ${{ steps.data.outputs.revision }}
          path: build/dp-data
          persist-credentials: false
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.0'
          use-public-rspm: true
      - name: Install document tools
        run: sudo apt-get update && sudo apt-get install -y pandoc texlive-xetex texlive-latex-extra
      - uses: r-lib/actions/setup-renv@v2
      - run: make check
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: manuscript
          path: ms/main.pdf
      - name: Preserve manuscript diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: manuscript-diagnostics
          path: |
            ms/main.tex
            ms/main.log
            ms/main.knit.md
          if-no-files-found: ignore
